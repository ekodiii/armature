    component_id: translator-pipeline
    description: "Codebase-to-graph translation pipeline \u2014 source ingestion and\
      \ skeleton extraction \u2014 producing a CodeSkeleton for the operator to annotate\
      \ and commit via graph-core tools."
    processing: Ingests source files and builds a mechanical code skeleton (symbols,
      imports, call graph, dataflow) that the LLM operator inspects and translates
      into Armature components via propose_component and propose_edge.
    input_types:
    - SourceRoot
    - TranslateCommand
    output_types:
    - VerifiedModel
