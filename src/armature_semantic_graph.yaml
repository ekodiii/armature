components:
  llm-operator:
    component_id: llm-operator
    description: External LLM agent (Claude or similar) that drives the armature server
      by calling MCP tools to plan, query, and implement graph-modeled systems.
    processing: Issues MCP tool calls representing planning intent, query requests,
      authoring mutations, and translation commands.
    input_types:
    - UserIntent
    output_types:
    - McpToolCall
    z_level: 0
    external: true
    parent_id: null
    version: 0
    implemented_version: null
    implemented_sha: null
    locations: []
  mcp-dispatch:
    component_id: mcp-dispatch
    description: "MCP tool dispatch surface (server.py) \u2014 the FastMCP entry point\
      \ that routes every incoming tool call to graph-core subsystems and serializes\
      \ responses."
    processing: Receives MCP tool calls, validates active-graph state, delegates to
      graph-core operations/writer, and returns structured JSON responses. Translation
      is operator-driven via skeleton tools, not via MCP session tools.
    input_types:
    - McpToolCall
    output_types:
    - McpToolResponse
    z_level: 0
    external: false
    parent_id: null
    version: 3
    implemented_version: 3
    implemented_sha: 34984cf7bd98852d7f30f625f1583db1edee92cd
    locations:
    - path: server.py
      start_line: 1
      end_line: 1269
  graph-core:
    component_id: graph-core
    description: "In-memory graph substrate \u2014 models, store, writer, validator,\
      \ warnings, operations, and serializer \u2014 that owns all component/edge state\
      \ and enforces structural integrity."
    processing: Accepts mutation and query requests, enforces graph invariants, runs
      warning checks, and persists state to YAML.
    input_types:
    - MutationRequest
    - QueryRequest
    output_types:
    - Graph
    - QueryResult
    - Warning
    z_level: 0
    external: false
    parent_id: null
    version: 1
    implemented_version: 1
    implemented_sha: 34984cf7bd98852d7f30f625f1583db1edee92cd
    locations:
    - path: models.py
      start_line: 1
      end_line: 80
    - path: writer.py
      start_line: 1
      end_line: 104
    - path: validator.py
      start_line: 1
      end_line: 218
    - path: graph_warnings.py
      start_line: 1
      end_line: 189
    - path: operations.py
      start_line: 1
      end_line: 104
    - path: serializer.py
      start_line: 1
      end_line: 135
