  verify-flow-grounding:
    component_id: verify-flow-grounding
    description: "Checks that every FLOW/REFERENCE edge in the SemanticModel has a\
      \ backing call/dataflow/import link in the CodeSkeleton. FLOW grounding is orientation-agnostic\
      \ \u2014 dataflow direction is the inverse of call direction, so both forward\
      \ and reverse call/dataflow pairs are accepted as evidence. Three finding kinds:\
      \ 'unverifiable' (neither endpoint anchored \u2014 excluded from the grounding\
      \ denominator), 'ungrounded' (both endpoints anchored, no link in either direction\
      \ \u2014 full score penalty), 'direction_suspect' (grounded only via reversed\
      \ call/dataflow \u2014 low-weight hint that the edge may point the wrong way).\
      \ REFERENCE edges remain bidirectional (unchanged)."
    processing: "For each FLOW edge where both endpoints are anchored and non-external:\
      \ (1) check forward \u2014 has_backing(from_syms, to_syms) or has_import_link\
      \ \u2192 grounded, no finding; (2) if not, check reverse \u2014 has_backing(to_syms,\
      \ from_syms) \u2192 grounded, emit direction_suspect; (3) if neither, emit ungrounded.\
      \ For REFERENCE edges: bidirectional check unchanged (already accepts either\
      \ direction). Emits unverifiable when neither endpoint has skeleton anchors.\
      \ One-sided-anchor edges are skipped (partial, not flagged)."
    input_types:
    - VerificationState
    output_types:
    - VerificationState
    z_level: 2
    external: false
    parent_id: trans-verify
