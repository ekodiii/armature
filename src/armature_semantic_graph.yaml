  dispatch-authoring:
    component_id: dispatch-authoring
    description: "Mutation + reconcile handlers: propose/update/delete_component,\
      \ propose_edge, delete_edge, mark_implemented (stamps git HEAD), ignore_warning,\
      \ and reconcile() \u2014 the git-sync drift detector exposed to the operator.\
      \ propose_edge returns a `caution` list when wiring a FLOW/REFERENCE edge to\
      \ a non-implemented (planned/stale/drifted) endpoint, so agents never wire into\
      \ stubs blind."
    processing: Validates and forwards component/edge mutation requests to writer,
      then re-runs warning checks and returns updated warning counts.
