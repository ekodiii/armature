      end_line: 626
  verify-reconciler:
    component_id: verify-reconciler
    description: 'Aggregates all VerificationState findings into a VerifiedModel with
      a weighted trust score across SIX dimensions: anchor (0.20), coverage (0.20),
      precision (0.15), contract (0.15), grounding (0.20), externals (0.10). precision_score
      = 1 - coarse-leaf prevalence over non-external leaves; externals_score = 0 when
      third-party boundaries exist but the graph models no external node. Grounding
      score: ungrounded findings count at weight 1.0 and direction_suspect findings
      at weight 0.1 against the verifiable-edge denominator (unverifiable edges excluded),
      result clamped to [0,1].'
    processing: Computes precision_score and externals_score, blends six weighted
