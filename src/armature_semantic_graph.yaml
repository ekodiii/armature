    component_id: core-warnings
    description: "Warning audit engine \u2014 hanging/starved/coverage/cycles/undefined/orphans\
      \ \u2014 run after every mutation. flow_cycle ids are per-cycle. hanging_output\
      \ exempts child outputs that match the parent's declared boundary (prevents\
      \ the fictional-sibling-edge incentive)."
    processing: Scans the full graph after each mutation for semantic health issues
