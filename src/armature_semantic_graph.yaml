warnings:
- id: hanging_output__mcp-dispatch
  ignore_reason: McpToolResponse is the terminal output returned to the LLM operator
    (external boundary). No internal consumer needed.
- id: hanging_output__graph-core
  ignore_reason: "Graph/QueryResult/Warning are the terminal outputs consumed by mcp-dispatch\
    \ serializers and the filesystem \u2014 boundary terminals, not internal gaps."
- id: hanging_output__translator-pipeline
  ignore_reason: MigrationReport is a terminal output returned to mcp-dispatch and
    then to the LLM operator. Justified boundary terminal.
- id: hanging_output__dispatch-lifecycle
  ignore_reason: "GraphRegistry/GraphStats are serialized directly into McpToolResponse\
    \ at the dispatch surface \u2014 justified terminal for this sub-handler group."
- id: hanging_output__dispatch-query
  ignore_reason: ComponentView/NavigationResult/WorkContext are the terminal read-path
    outputs serialized as McpToolResponse back to the LLM operator.
- id: hanging_output__dispatch-authoring
  ignore_reason: MutationResult/WarningCount are terminal outputs returned as McpToolResponse
    to the LLM operator after each write.
- id: hanging_output__dispatch-prompts
  ignore_reason: "ModePrompt is a terminal output \u2014 a text payload returned directly\
    \ to the LLM operator to configure its working mode."
- id: hanging_output__dispatch-helpers
  ignore_reason: "GraphRegistry/SerializedComponent are internal helper outputs consumed\
    \ by all dispatch handlers \u2014 fan-out to siblings via REFERENCE, not FLOW\
    \ chains."
- id: hanging_output__core-writer
  ignore_reason: "ValidationError is a terminal error output returned synchronously\
    \ to callers (dispatch-authoring, trans-commit) \u2014 no downstream sibling in\
    \ graph-core consumes it."
- id: hanging_output__core-validator
  ignore_reason: "ValidationError is a terminal error signal raised synchronously\
    \ by core-validator back to core-writer's caller \u2014 no sibling consumer at\
    \ this level."
- id: hanging_output__core-serializer
  ignore_reason: YamlGraph is written to the external filesystem; Graph is returned
    on load to the registry. Both are justified terminal outputs at the serializer
    boundary.
- id: hanging_output__ops-neighbors
  ignore_reason: "NeighborList is consumed by the dispatch-query handler (get_neighbors)\
    \ cross-boundary \u2014 terminal output within core-operations decomposition."
- id: hanging_output__ops-references
  ignore_reason: "ReferenceList is consumed by the dispatch-query handler (get_references)\
    \ cross-boundary \u2014 terminal output within core-operations decomposition."
- id: hanging_output__ops-subgraph
  ignore_reason: "SubgraphView is consumed by dispatch-query (get_subgraph) cross-boundary\
    \ \u2014 terminal output within core-operations decomposition."
- id: hanging_output__ops-path
  ignore_reason: "ComponentPath is consumed by dispatch-query (get_path) cross-boundary\
    \ \u2014 terminal output within core-operations decomposition."
- id: hanging_output__ops-impact
  ignore_reason: "ImpactSet is consumed by dispatch-query (get_impact) cross-boundary\
    \ \u2014 terminal output within core-operations decomposition."
- id: hanging_output__ops-walk-flow
  ignore_reason: "ComponentIdSet is an intermediate result consumed by ops-impact\
    \ and ops-path within the same decomposition \u2014 already wired via FLOW; residual\
    \ hanging on the sibling chain is a boundary artifact."
- id: hanging_output__store-read
  ignore_reason: "Component/Edge lookups from store-read are consumed by core-operations\
    \ and core-writer cross-boundary \u2014 terminal outputs at the store-read level\
    \ within core-store decomposition."
- id: hanging_output__query-code-warnings
  ignore_reason: "SourceSnippet/WarningList are terminal outputs returned to the LLM\
    \ operator \u2014 exits dispatch-query boundary as McpToolResponse."
- id: hanging_output__trans-models
  ignore_reason: "RawNode/GraphDraft/MigrationReport are data contracts consumed cross-boundary\
    \ by all pipeline stages via REFERENCE \u2014 trans-models is a shared type registry,\
    \ not a flow producer."
- id: hanging_output__query-response-shaper
  ignore_reason: ShapedView is a shared formatting helper's output, returned by the
    read handlers that REFERENCE it; no sibling FLOW consumer by design.
- id: hanging_output__ops-rank
  ignore_reason: RankedComponents is consumed by query-locate across the boundary
    via REFERENCE (the read path), not by a core-operations sibling.
- id: hanging_output__dispatch-translate
  ignore_reason: TranslateResult is a terminal MCP tool response returned to the operator
    (like the other dispatch-* tool surfaces), not consumed by a sibling.
- id: hanging_output__test-suite
  ignore_reason: TestReport (pass/fail) is a terminal CI artifact, not consumed by
    any in-graph component. Intentional side output.
- id: hanging_output__git-sync
  ignore_reason: Planned subsystem; ReconcileReport/DriftMark consumed by the operator
    + graph-core (REFERENCE), wired at implementation.
- id: starved_input__graph-core
  ignore_reason: "MutationRequest/QueryRequest enter graph-core from mcp-dispatch\
    \ at the z=0 FLOW boundary \u2014 justified entry inputs from an external caller."
- id: starved_input__translator-pipeline
  ignore_reason: "SourceRoot/TranslateCommand enter translator-pipeline from mcp-dispatch\
    \ and the filesystem at the z=0 boundary \u2014 justified entry inputs."
- id: starved_input__dispatch-lifecycle
  ignore_reason: "McpToolCall enters dispatch-lifecycle from the parent mcp-dispatch\
    \ fan-in \u2014 now that dispatch-helpers feeds lifecycle via FLOW, the McpToolCall\
    \ input type is still an external boundary entry that arrives from llm-operator\
    \ at z=0. Justified boundary entry."
- id: starved_input__dispatch-query
  ignore_reason: "McpToolCall enters dispatch-query from the parent mcp-dispatch which\
    \ fans out to all handler groups \u2014 justified entry at this decomposition\
    \ boundary."
- id: starved_input__dispatch-authoring
  ignore_reason: "McpToolCall enters dispatch-authoring from parent mcp-dispatch fan-out\
    \ \u2014 justified entry at this decomposition boundary."
- id: starved_input__dispatch-prompts
  ignore_reason: "McpToolCall enters dispatch-prompts from parent mcp-dispatch fan-out\
    \ \u2014 justified entry at this decomposition boundary."
- id: starved_input__core-writer
  ignore_reason: "MutationRequest enters core-writer from dispatch-authoring/trans-commit\
    \ cross-boundary \u2014 justified entry point for the write path."
- id: starved_input__core-validator
  ignore_reason: "Component/Edge enter core-validator from core-writer which calls\
    \ it synchronously \u2014 cross-boundary call, not a sibling FLOW, so no upstream\
    \ sibling producer exists at this level."
- id: starved_input__core-warnings
  ignore_reason: "Graph enters core-warnings from core-writer after each mutation\
    \ \u2014 this is a cross-level call from the write path, not a sibling FLOW input."
- id: starved_input__core-operations
  ignore_reason: "QueryRequest enters core-operations from dispatch-query cross-boundary\
    \ \u2014 justified entry point for the read path at this decomposition level."
- id: starved_input__core-serializer
  ignore_reason: "Graph/FilePath enter core-serializer from core-writer (persist)\
    \ and dispatch-lifecycle (load_graph) \u2014 cross-boundary calls, not sibling\
    \ FLOW inputs at this level."
- id: starved_input__ops-references
  ignore_reason: "Graph/ComponentId/Direction are passed into ops-references from\
    \ the dispatch-query handler cross-boundary \u2014 justified entry inputs within\
    \ core-operations decomposition."
- id: starved_input__ops-subgraph
  ignore_reason: "Graph/ComponentId/Depth are passed in from dispatch-query cross-boundary\
    \ \u2014 justified entry inputs within core-operations decomposition."
- id: starved_input__ops-path
  ignore_reason: "Graph/FromComponentId/ToComponentId are passed in from dispatch-query\
    \ cross-boundary \u2014 justified entry inputs within core-operations decomposition."
- id: starved_input__ops-impact
  ignore_reason: "Graph/ComponentId are passed in from dispatch-query (get_impact)\
    \ cross-boundary \u2014 justified entry inputs within core-operations decomposition."
- id: starved_input__store-read
  ignore_reason: "ComponentId enters store-read from core-operations and core-writer\
    \ cross-boundary \u2014 justified entry input within core-store decomposition."
- id: starved_input__store-index
  ignore_reason: "Component/Edge enter store-index from store-write as a synchronous\
    \ call \u2014 the FLOW edge store-write \u2192 store-index captures this; the\
    \ starved input is on the direct Component/Edge types not carried by that FLOW."
- id: starved_input__query-topology
  ignore_reason: "McpToolCall enters query-topology from parent dispatch-query fan-out\
    \ \u2014 justified entry at this decomposition boundary."
- id: starved_input__query-work-context
  ignore_reason: "McpToolCall enters query-work-context from parent dispatch-query\
    \ fan-out \u2014 justified entry at this decomposition boundary."
- id: starved_input__query-code-warnings
  ignore_reason: "McpToolCall enters query-code-warnings from parent dispatch-query\
    \ fan-out \u2014 justified entry at this decomposition boundary."
