  vr-dispatch-verify:
    component_id: vr-dispatch-verify
    description: "MVP tool surface: verify_contract(component_id, properties[, strategies])\
      \ \u2014 the operator authors property statements against the leaf's contract/code\
      \ (seen via get_work_context / get_component_code); the tool packages them into\
      \ an Obligation, routes, assembles a Hypothesis test, runs it against the REAL\
      \ code, and returns the ObligationResult (verified / refuted+counterexample\
      \ / unverifiable / error). Operator is the author, the run is the check \u2014\
      \ no embedded LLM. Turns 'verifiable goals' from a structural claim into a behavioral\
      \ one the operator can invoke."
    processing: Resolve component_id -> LeafContract (+ recovered signature) via graph-core;
      build the Obligation from the operator-authored properties; drive route -> synthesize
      -> run -> interpret; serialize the ObligationResult as the McpToolResponse.
      Refuses non-leaf / unanchored components.
    input_types:
    - McpToolCall
    output_types:
    - McpToolResponse
    z_level: 1
    external: false
    parent_id: mcp-dispatch
    version: 3
    implemented_version: 3
    implemented_sha: 3eae206b09624be27fdaa57643ad90982f6fe1b8
    feature: verification-router
    locations:
    - path: server.py
      start_line: 1262
      end_line: 1335
