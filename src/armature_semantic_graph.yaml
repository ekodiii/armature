  dispatch-helpers:
    component_id: dispatch-helpers
    description: "Internal server utilities: registry/workspace helpers (_load/_save_registry,\
      \ _valid_name, _active_path, _project_root, _set_active, _no_active), persistence\
      \ (_recompute_warnings recomputes warnings in memory; _persist also saves),\
      \ and response shaping (_fetch, _parse_edge_type, _loc_dict, _status, _comp_dict,\
      \ _terse, _line + LINE_LEGEND \u2014 the one-line text formatter behind all\
      \ terse list views, _stub_alert \u2014 the planned/stale/drifted dependency\
      \ flagger behind work-context alerts and edge cautions, _active_count). _set_active\
      \ invalidates the cached translation skeleton on graph switch; boot is exception-safe."
