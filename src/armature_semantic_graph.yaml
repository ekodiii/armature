    component_id: dispatch-prompts
    description: "Prompt/mode handlers: armature_plan, armature_translate, armature_implement\
      \ \u2014 return rich contextual system prompts that configure the LLM operator\
      \ for a specific working mode. The implement prompt instructs the operator to\
      \ treat get_work_context `alerts` and propose_edge `caution`s as blocking signals:\
      \ surface a planned/stale/drifted dependency to the human before building against\
      \ it."
    processing: Returns mode-specific instruction prompts (plan, translate, implement)
