      \ guards all mutations and consistency scans. detect_cycles is now an iterative\
      \ three-colour DFS that returns the full cycle path (not just the re-entry node)\
      \ and has no recursion-depth limit."
    processing: Enforces graph structural rules (z-level parity, sibling constraints,
