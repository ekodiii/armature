      end_line: 97
    - path: writer.py
      start_line: 1
      end_line: 136
    - path: validator.py
      start_line: 1
      end_line: 218
    - path: graph_warnings.py
      start_line: 1
      end_line: 204
    - path: operations.py
      start_line: 1
      end_line: 148
    - path: serializer.py
      start_line: 1
