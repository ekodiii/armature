    description: "External filesystem \u2014 the source code tree being translated\
      \ and the YAML graph files being persisted."
    processing: Stores source files read by ingestion and graph YAML files written
      by the serializer.
    input_types:
    - YamlGraph
    output_types:
    - SourceFile
    - YamlGraph
    z_level: 0
    external: true
    parent_id: null
    version: 0
    implemented_version: null
    implemented_sha: null
    locations: []
  dispatch-lifecycle:
    component_id: dispatch-lifecycle
    description: 'Graph lifecycle and registry handlers: list_graphs, new_graph, open_graph,
      get_graph_stats. open_graph now returns a clean error on a bad file instead
      of crashing; new_graph backs up an existing file to .bak before an overwrite;
      get_graph_stats recomputes warnings in memory without writing the file (reads
      no longer dirty the graph).'
    processing: Manages the named-graph registry (load/save/validate), creates empty
      graphs, switches the active graph, and returns orientation stats.
