      start_line: 387
      end_line: 512
  dispatch-query:
    component_id: dispatch-query
    description: Navigation/query handlers + orientation. get_graph_stats and get_pending_implementation
      now surface the 'drifted' status (code changed in git since verification) alongside
      planned/stale/implemented.
    processing: Dispatches read-only queries to operations and store and returns terse-by-default
      responses (full detail opt-in) shaped for token efficiency; additionally serves
