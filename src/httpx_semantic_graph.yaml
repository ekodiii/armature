- id: starved_input__url_subsystem.query_params
  ignore_reason: "QueryParamTypes enter from user-supplied params arg \u2014 graph\
    \ boundary input from user code."
- id: starved_input__headers_cookies.cookies
  ignore_reason: "Response arrives from response_model (via Set-Cookie extraction)\
    \ and CookieTypes from user boundary \u2014 both are intentional inputs from outside\
    \ this subsystem."
- id: starved_input__config_subsystem.timeout
  ignore_reason: "TimeoutTypes enter from user-supplied timeout arg at client construction\
    \ \u2014 graph boundary input."
- id: starved_input__redirect_handler.dispatch_loop.single_request
  ignore_reason: "Request enters from hook_runner (sibling) after hooks fire \u2014\
    \ the FLOW hook_runner\u2192single_request models this; the starved type is already\
    \ wired."
- id: starved_input__redirect_handler.request_rewriter.header_scrubber
  ignore_reason: "Headers and URL arrive from the original Request being rewritten\
    \ \u2014 boundary inputs at this z-level, not produced by sibling nodes."
- id: starved_input__response_model.content_decoder_chain.chunk_pipeline
  ignore_reason: "SyncByteStream arrives from the transport via response_model.stream_reader\
