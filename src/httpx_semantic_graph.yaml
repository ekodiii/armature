  auth_handler:
    component_id: auth_handler
    description: Drives the authentication coroutine protocol. Auth is a generator
      that yields Request objects and receives Response objects back, enabling multi-round-trip
      schemes (Digest, OAuth challenge-response). The client drives the generator
      loop, re-sending requests until the auth flow is exhausted.
    processing: "Resolve auth: client default \u2192 per-request override. Call auth.sync_auth_flow(request)\
      \ / async_auth_flow(request). Drive the generator: yield Request, receive Response,\
      \ repeat until StopIteration. Supports BasicAuth (single round), DigestAuth\
      \ (challenge-response), NetRCAuth, and arbitrary user-defined Auth subclasses."
    input_types:
