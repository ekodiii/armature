  request_builder:
    component_id: request_builder
    description: Constructs a fully-formed Request object from user inputs. Merges
      URL (with base_url and query params), headers, cookies, and selects the right
      content encoder for the body (raw bytes, urlencoded form, multipart, JSON).
      The output is an immutable snapshot ready to be handed to the auth/transport
      layer.
    processing: Merge base_url + relative URL + per-request params. Merge client headers
      + per-request headers. Merge client cookies + per-request cookies. Invoke encode_request()
      to pick ByteStream/IteratorByteStream/MultipartStream/JSON body, set Content-Type
      and Content-Length headers accordingly.
    input_types:
    - RequestParams
    - ClientDefaults
    output_types:
