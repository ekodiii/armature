  redirect_handler:
    component_id: redirect_handler
    description: Handles HTTP redirect chains. After each response, inspects Location
      header; if present and follow_redirects=True, builds a new Request (potentially
      changing method, stripping sensitive headers, preserving or dropping the body
      per RFC 7231). Guards against redirect loops and max_redirects exhaustion. Fires
      request/response event hooks around each hop.
    processing: 'Loop: fire request hooks, dispatch via transport, fire response hooks.
      If response has redirect location: call _build_redirect_request (new URL, method
      coercion GET on 301/302/303, header scrubbing), append to history, repeat. Return
