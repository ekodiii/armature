warnings:
- id: hanging_output__client
  ignore_reason: "Response is the terminal output delivered to the caller \u2014 no\
    \ downstream consumer within the graph."
- id: hanging_output__redirect_handler
  ignore_reason: "Response returned to auth_handler feedback loop or ultimately to\
    \ client \u2014 terminal within this z-level view; wired at parent scope."
- id: hanging_output__response_model
  ignore_reason: "DecodedResponse is the terminal user-facing artifact \u2014 cookies\
    \ extracted and response returned to caller."
- id: hanging_output__url_subsystem
  ignore_reason: "URL is consumed by request_builder; the FLOW from url_subsystem\
    \ to request_builder is present \u2014 this is a supporting subsystem feeding\
    \ the builder."
- id: hanging_output__headers_cookies
  ignore_reason: "Headers/Cookies flow into request_builder (upward FLOW) and are\
    \ also extracted from Response \u2014 bidirectional supporting subsystem, not\
    \ a single linear sink."
- id: hanging_output__config_subsystem
  ignore_reason: "Timeout/Limits/Proxy/SSLContext are value objects injected into\
    \ Client at construction time \u2014 they feed the client node but the cycle is\
    \ init-time, not per-request FLOW."
- id: hanging_output__content_encoding
  ignore_reason: "Encoded stream feeds request_builder (request side) and decoded\
    \ bytes feed response_model (response side) \u2014 both are wired; the warning\
    \ is a z=0 coarseness artifact."
- id: hanging_output__exceptions
  ignore_reason: "HTTPError propagates as an exception, not a data flow value \u2014\
    \ it is a side-exit, not a downstream consumer input."
- id: hanging_output__public_api
  ignore_reason: "public_api is the outermost boundary \u2014 Response is returned\
    \ to the end user / CLI, which is outside the graph."
- id: hanging_output__client.lifecycle
  ignore_reason: ClientState is internal state, not propagated as data flow output
    beyond lifecycle management.
- id: hanging_output__client.send_pipeline
  ignore_reason: "Response is the terminal output of the send pipeline \u2014 returned\
    \ to the caller of client.send()."
- id: hanging_output__client.transport_selection
  ignore_reason: "BaseTransport is injected into send_pipeline as a dependency, not\
    \ a FLOW data value \u2014 it's a resolved capability object."
- id: hanging_output__client.event_hooks
  ignore_reason: "Event hooks pass Request/Response through unchanged as a side-effect\
    \ notification \u2014 the mutated values feed back into the pipeline via the same\
    \ references."
- id: hanging_output__request_builder.url_merge
  ignore_reason: "URL flows into header_merge via Request construction \u2014 the\
    \ merge ordering at z=1 is sequential build-up into a single Request object."
- id: hanging_output__request_builder.body_encoder
  ignore_reason: "SyncByteStream and Headers feed into header_merge as inputs to Request\
    \ construction \u2014 the FLOW edge is body_encoder\u2192header_merge."
- id: hanging_output__request_builder.header_merge
  ignore_reason: "Headers is the final merged output that composes the Request \u2014\
    \ returned to auth_handler as part of the built Request object."
- id: hanging_output__auth_handler.basic
  ignore_reason: "Request is terminal output of auth scheme \u2014 yielded to the\
    \ auth_handler.flow_protocol driver which dispatches it onward."
- id: hanging_output__auth_handler.digest
  ignore_reason: "Request is terminal output of digest challenge-response \u2014 yielded\
    \ to flow_protocol driver after computing Authorization header."
- id: hanging_output__transport_layer.http_transport
  ignore_reason: "Response is the terminal product of the HTTP transport \u2014 returned\
    \ up to redirect_handler/auth_handler."
- id: hanging_output__transport_layer.async_transport
  ignore_reason: "Response is the terminal product of the async transport \u2014 returned\
    \ up to AsyncClient's redirect/auth loop."
- id: hanging_output__transport_layer.wsgi_asgi
  ignore_reason: "Response is the terminal product of the in-process WSGI/ASGI transport\
    \ \u2014 returned up to the client pipeline for testing."
- id: hanging_output__response_model.text_json
  ignore_reason: "str/Any are the final user-accessible decoded values \u2014 terminal\
    \ outputs delivered to the caller of .text/.json()."
- id: hanging_output__url_subsystem.parser
  ignore_reason: "ParseResult feeds into URL constructor which is consumed by query_params\
    \ and the URL object \u2014 internal sub-step, not a graph-level sink."
- id: hanging_output__url_subsystem.query_params
  ignore_reason: "QueryParams is terminal output of URL subsystem \u2014 consumed\
    \ by request_builder.url_merge when merging client params with per-request params."
- id: hanging_output__content_encoding.multipart
  ignore_reason: "MultipartStream is a SyncByteStream subtype \u2014 it IS the body\
    \ stream returned by body_encoder to request_builder; wired at parent level."
- id: hanging_output__content_encoding.response_decoders
  ignore_reason: "Decoded bytes feed into content_decoder_chain which passes them\
    \ to response_model \u2014 wired at parent level."
- id: hanging_output__headers_cookies.headers
  ignore_reason: "Headers flows into Cookies and into request/response objects \u2014\
    \ consumed at parent level by both request_builder and response_model."
- id: hanging_output__headers_cookies.cookies
  ignore_reason: "Cookies jar is stored on the client and injected into requests \u2014\
    \ a persistent side-effect store, not a linear data flow sink."
- id: hanging_output__config_subsystem.timeout
  ignore_reason: "Timeout is a value object stored on the client and written into\
    \ request.extensions \u2014 init-time injection, not per-request FLOW."
- id: hanging_output__config_subsystem.ssl
  ignore_reason: "SSLContext is passed to HTTPTransport at init time \u2014 an injected\
    \ dependency, not a per-request FLOW output."
- id: hanging_output__exceptions.network_errors
  ignore_reason: "TransportError propagates as an exception side-exit \u2014 not a\
    \ downstream data consumer input."
- id: hanging_output__exceptions.http_errors
  ignore_reason: "HTTPStatusError propagates as an exception raised by response.raise_for_status()\
    \ \u2014 terminal side-exit, not a FLOW sink."
- id: hanging_output__public_api.functional
  ignore_reason: "Response is the terminal output returned to the user of the one-shot\
    \ convenience functions \u2014 outside the graph boundary."
- id: hanging_output__public_api.cli
  ignore_reason: "Response is consumed by the CLI printer (pretty-print to stdout)\
    \ \u2014 a side-effect terminal, not a data flow sink within the graph."
- id: hanging_output__redirect_handler.dispatch_loop.single_request
  ignore_reason: "Response returned from single_request feeds back into hook_runner\
    \ \u2014 the FLOW is hook_runner\u2192single_request, return is implicit via the\
    \ caller loop."
- id: hanging_output__redirect_handler.dispatch_loop.hook_runner
  ignore_reason: "Response is the terminal output of each dispatch hop \u2014 returned\
    \ up through the redirect loop to auth_handler or the caller."
- id: hanging_output__transport_layer.http_transport.response_translator
  ignore_reason: "Response is the terminal product of the transport \u2014 returned\
    \ up to redirect_handler.dispatch_loop.single_request."
- id: hanging_output__auth_handler.flow_protocol.body_buffer
  ignore_reason: "Response is passed into the generator via flow.send(response) after\
    \ body buffering \u2014 not a downstream graph node, it re-enters the generator\
    \ coroutine directly."
- id: hanging_output__auth_handler.flow_protocol.generator_driver
  ignore_reason: "Request yielded from generator_driver goes to the client's send\
    \ loop (redirect_handler) \u2014 cross-boundary delivery modeled at the parent\
    \ z-level."
- id: hanging_output__redirect_handler.request_rewriter.method_coercion
  ignore_reason: "Method string feeds into header_scrubber to determine whether to\
    \ strip body \u2014 the FLOW edge method_coercion\u2192header_scrubber captures\
    \ this."
- id: hanging_output__redirect_handler.request_rewriter.header_scrubber
  ignore_reason: "Scrubbed Headers compose the new redirect Request \u2014 terminal\
    \ output assembled by _build_redirect_request at the parent level."
- id: hanging_output__response_model.content_decoder_chain.chunk_pipeline
  ignore_reason: "Decoded bytes are the terminal output of the decoder pipeline \u2014\
    \ consumed by response_model.stream_reader._content cache or yielded to the caller\
    \ of iter_bytes()."
- id: starved_input__client
  ignore_reason: "RequestParams enters at the graph boundary from user code \u2014\
    \ it is the external input to the system."
- id: starved_input__request_builder
  ignore_reason: "RequestParams and ClientDefaults enter from user call and Client.__init__\
    \ respectively \u2014 both are graph-boundary inputs."
- id: starved_input__auth_handler
  ignore_reason: "Auth object is injected at client construction or per-request \u2014\
    \ boundary input."
- id: starved_input__transport_layer
  ignore_reason: "Request arrives from redirect_handler which is a sibling FLOW; the\
    \ starved warning is because redirect_handler outputs Response not Request \u2014\
    \ the transport input is fed by redirect_handler's internal dispatch, wired at\
    \ z=1."
- id: starved_input__headers_cookies
  ignore_reason: HeaderTypes/CookieTypes enter from user code at graph boundary; headers_cookies
    is a supporting subsystem called by both request_builder and response_model.
- id: starved_input__exceptions
  ignore_reason: "HTTPCoreException enters from ext_httpcore (external boundary) and\
