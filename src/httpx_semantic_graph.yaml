components:
  client:
    component_id: client
    description: "The public entry point for making HTTP requests. Client (sync) and\
      \ AsyncClient manage lifecycle (open/close), merge per-request overrides with\
      \ client-level defaults, and orchestrate the full send pipeline. The thin get/post/put/\u2026\
      \ verbs are convenience wrappers that delegate immediately to request() \u2192\
      \ send()."
    processing: Accept user-supplied method, URL, headers, cookies, auth, timeout,
      follow_redirects. Merge with client defaults (base_url, default headers/cookies/params).
      Build a Request object, then invoke send(); buffer the full body unless stream=True.
    input_types:
    - RequestParams
    output_types:
    - Response
