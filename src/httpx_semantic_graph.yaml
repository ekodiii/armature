    \ mapping layer."
- id: starved_input__client.send_pipeline
  ignore_reason: "Auth and bool (follow_redirects) are boundary inputs from user call\
    \ to send() \u2014 per-request overrides entering the graph."
- id: starved_input__request_builder.header_merge
  ignore_reason: "HeaderTypes inputs come from client defaults and per-request args\
    \ \u2014 graph boundary inputs, not produced by sibling nodes at this z-level."
- id: starved_input__redirect_handler.request_rewriter
  ignore_reason: "Request rewriter receives original Request from dispatch_loop via\
